# Publishes to npm via Trusted Publishing (OIDC, no npm token).
# Runs on a pushed tag vX.Y.Z, or manually from the Actions tab.
name: Publish to npm

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      # trusted publishing needs npm >= 11.5.1
      - run: npm install -g npm@latest
      - name: Tag must match package version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          v=$(node -p "require('./package.json').version")
          test "${GITHUB_REF_NAME}" = "v${v}" || { echo "tag ${GITHUB_REF_NAME} != v${v}"; exit 1; }
      - run: npm ci
      # prepublishOnly runs typecheck, build and tests
      - run: npm publish
